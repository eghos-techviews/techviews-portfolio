<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Tech Views — Frontend Developer portfolio showcasing interactive web apps, real-time dashboards, and modern UI engineering." />
		<meta name="theme-color" content="#0a0f1e" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('tv-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (saved === 'dark' || (!saved && prefersDark)) {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-cream-50 dark:bg-[#0f0c08] transition-colors duration-300">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
